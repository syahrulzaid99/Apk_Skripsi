org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Nonaktifkan Kotlin incremental compilation.
# Workaround bug Kotlin di Windows saat project (D:) dan pub cache/plugin (C:)
# berada di drive berbeda — RelocatableFileToPathConverter gagal membuat path
# relatif lintas-drive dan menyebabkan "Could not close incremental caches".
kotlin.incremental=false
kotlin.daemon.jvm.options=-Xmx2G

